<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'"><title>Legion</title>
<style>
:root { color-scheme: light dark; --bg: #211e1b; --ink: #ece2cc; --accent: #bd9a55; }
* { box-sizing: border-box; } body { margin: 0; background: transparent; color: var(--ink); font: 12px system-ui, sans-serif; }
nav { min-height: 38px; display: flex; align-items: center; gap: 4px; padding: 3px 10px; background: var(--bg); border-bottom: 1px solid color-mix(in srgb, var(--accent) 35%, transparent); }
#tabs { display: flex; align-items: center; gap: 3px; min-width: 0; overflow-x: auto; scrollbar-width: thin; } .tab { display: inline-flex; align-items: center; gap: 2px; max-width: 180px; height: 28px; padding: 0 4px 0 6px; border-radius: 7px; border-bottom: 2px solid transparent; background: color-mix(in srgb, var(--accent) 12%, transparent); } .tab[data-active="true"] { background: color-mix(in srgb, var(--accent) 30%, transparent); border-bottom-color: var(--accent); } .tab-label { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .tab-close { min-width: 22px; width: 22px; height: 24px; padding: 0; } .tab-label:hover, .tab-close:hover { background: color-mix(in srgb, var(--accent) 22%, transparent); } .tab-label:focus-visible, .tab-close:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; } .new-tab { min-width: 26px; } .tab[data-status="loading"] .tab-label::before { content: '… '; } .tab[data-status="error"] .tab-label { color: #ff9b91; }
button { min-width: 30px; height: 28px; border: 0; border-radius: 7px; color: inherit; background: transparent; font: inherit; cursor: pointer; }
button:hover:not(:disabled) { background: color-mix(in srgb, var(--accent) 22%, transparent); }
button:disabled { opacity: .35; cursor: default; } .icon { font-size: 19px; line-height: 1; } .spacer { flex: 1; } .status { color: var(--ink); opacity: .85; white-space: nowrap; } .dot { color: var(--accent); } .account { padding: 0 9px; }
#account-menu { position: absolute; z-index: 2; top: 38px; right: 8px; width: min(320px, calc(100vw - 16px)); max-height: calc(100vh - 46px); overflow: auto; padding: 8px; border: 1px solid var(--accent); border-radius: 8px; background: var(--bg); box-shadow: 0 6px 20px #0008; }
#account-menu[hidden], #profile-form[hidden] { display: none; } #profile-list, .menu-actions, #profile-form { display: grid; gap: 4px; } #account-menu button { text-align: left; padding: 0 8px; } #profile-list { max-height: 150px; overflow-y: auto; } #profile-form { padding: 8px; } #profile-name { min-width: 0; } #profile-error { color: #ff9b91; }
</style></head><body><nav aria-label="Панель приложения">
 <button id="back" class="icon" title="Назад" aria-label="Назад">‹</button><button id="forward" class="icon" title="Вперёд" aria-label="Вперёд">›</button><button id="reload" class="icon" title="Обновить" aria-label="Обновить">⟳</button><div id="tabs" role="tablist" aria-label="Вкладки"></div><button id="new-tab" class="new-tab" title="Новая вкладка" aria-label="Новая вкладка">＋</button>
  <span class="spacer"></span><span class="status" id="status">Патчи: …</span><button id="settings" title="Настройки патчей" aria-label="Настройки патчей">⚙</button><button class="account" id="account" title="Профили и вкладки" aria-expanded="false" aria-controls="account-menu">Аккаунт ▾</button><div id="account-menu" hidden aria-label="Профили"><div id="profile-list"></div><div class="menu-actions"><button id="menu-new" type="button">Новая сессия</button><button id="menu-save" type="button" hidden>Сохранить текущую</button><button id="menu-rename" type="button" hidden>Переименовать</button><button id="menu-delete" type="button" hidden>Удалить</button></div><form id="profile-form" hidden><label for="profile-name">Имя профиля</label><input id="profile-name" name="name" maxlength="63" required><span id="profile-error" role="alert"></span><button type="submit">Сохранить</button><button id="profile-cancel" type="button">Отмена</button></form></div>
 </nav><script src="theme.js"></script><script src="toolbar.js"></script></body></html>
