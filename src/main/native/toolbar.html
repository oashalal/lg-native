<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'"><title>Legion</title>
<style>
:root { color-scheme: light dark; --bg: #211e1b; --ink: #ece2cc; --accent: #bd9a55; }
* { box-sizing: border-box; } body { margin: 0; background: var(--bg); color: var(--ink); font: 12px system-ui, sans-serif; }
nav { height: 38px; display: flex; align-items: center; gap: 4px; padding: 3px 10px; border-bottom: 1px solid color-mix(in srgb, var(--accent) 35%, transparent); }
button { min-width: 30px; height: 28px; border: 0; border-radius: 7px; color: inherit; background: transparent; font: inherit; cursor: pointer; }
button:hover:not(:disabled), button:focus-visible { background: color-mix(in srgb, var(--accent) 22%, transparent); outline: none; }
button:disabled { opacity: .35; cursor: default; } .icon { font-size: 19px; line-height: 1; } .spacer { flex: 1; } .status { color: var(--ink); opacity: .85; white-space: nowrap; } .dot { color: var(--accent); } .account { padding: 0 9px; }
</style></head><body><nav aria-label="Панель приложения">
<button id="back" class="icon" title="Назад" aria-label="Назад">‹</button><button id="forward" class="icon" title="Вперёд" aria-label="Вперёд">›</button><button id="reload" class="icon" title="Обновить" aria-label="Обновить">⟳</button>
<span class="spacer"></span><span class="status" id="status">Патчи: …</span><button id="settings" title="Настройки патчей" aria-label="Настройки патчей">⚙</button><button class="account" disabled title="Переключение аккаунтов пока недоступно">Аккаунт ▾</button>
</nav><script src="theme.js"></script><script src="toolbar.js"></script></body></html>
