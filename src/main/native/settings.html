<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'"><title>Настройки патчей</title>
<style>:root{color-scheme:light dark;--bg:#211e1b;--surface:#29231c;--surface2:#181512;--ink:#ece2cc;--accent:#bd9a55}*{box-sizing:border-box}body{margin:0;padding:22px;background:var(--bg);color:var(--ink);font:14px var(--tx,system-ui),sans-serif}h1{font:400 28px var(--hd,Georgia),serif;color:var(--accent);margin:0 0 18px}.patch{margin:12px 0;padding:14px 16px;border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);border-radius:14px;background:var(--surface)}.head{display:flex;align-items:center;gap:10px}.head h2{font:400 19px var(--hd,Georgia),serif;margin:0;flex:1}.field{display:grid;gap:5px;margin-top:12px}.field label{color:var(--accent)}input[type=text],input[type=number]{width:100%;padding:8px;border:1px solid var(--accent);border-radius:8px;background:var(--surface2);color:var(--ink)}input[type=checkbox]{accent-color:var(--accent);width:17px;height:17px}.desc{opacity:.7;font-size:12px}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}button{padding:9px 16px;border:1px solid var(--accent);border-radius:9px;background:transparent;color:inherit;cursor:pointer}button.primary{background:color-mix(in srgb,var(--accent) 25%,transparent)}#message{min-height:20px;margin-top:10px;color:var(--accent)}</style></head><body><h1>Настройки патчей</h1><main id="patches">Загрузка…</main><div class="actions"><button id="cancel">Закрыть</button><button id="save" class="primary">Сохранить</button></div><div id="message"></div><script src="theme.js"></script><script src="settings.js"></script></body></html>
